<div class="users">
  <div class="users_container">
    <h2 class="users_title">Список Пользователей</h2>
    <user-create (addUser)="addUser($event)" />
    <users-filter (filterUsers)="onFilterUsers($event)" />
    <div class="users_wrapper">
      @for (user of filteredUsers$ | async; track user.id) {
        <user-card [user]="user" (remove)="onRemoveUser(user.id)" />
      } @empty {
        <div>Пользователи не найдены</div>
      }
    </div>
  </div>
</div>
