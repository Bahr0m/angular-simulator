<div class="users">
  <div class="users_container">
    <h2 class="users_title">Список Пользователей</h2>
    <div>
      <button>Создать пользователя</button>
    </div>
    <div class="users_wrapper">
      @for (user of users$ | async; track user.id) {
        <user-card [user]="user" (remove)="removeUser(user.id)" />
      } @empty {
        <div></div>
      }
    </div>
  </div>
</div>
