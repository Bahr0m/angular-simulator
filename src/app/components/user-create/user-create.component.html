<form [formGroup]="createUserForm">
  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" formControlName="name" />
  </div>
  <div class="form-group">
    <label for="username">Username</label>
    <input type="text" id="username" formControlName="username" />
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" formControlName="email" />
  </div>
  <div class="form-group">
    <label for="phone">Phone</label>
    <input type="text" id="phone" formControlName="phone" />
  </div>
  <div class="form-group">
    <label for="website">Website</label>
    <input type="text" id="website" formControlName="website" />
  </div>
  <div formGroupName="address">
    <h2>Address</h2>
    <div class="form-group">
      <label for="city">City</label>
      <input type="text" id="city" formControlName="city" />
    </div>
    <div class="form-group">
      <label for="street">Street</label>
      <input type="text" id="street" formControlName="street" />
    </div>
    <div class="form-group">
      <label for="suite">Suite</label>
      <input type="text" id="suite" formControlName="suite" />
    </div>
    <div class="form-group">
      <label for="zipcode">Zip Code</label>
      <input type="text" id="zipcode" formControlName="zipcode" />
    </div>
  </div>
  <div formGroupName="company">
    <h2>Company</h2>
    <div class="form-group">
      <label for="companyName">Company Name</label>
      <input type="text" id="companyName" formControlName="name" />
    </div>
    <div class="form-group">
      <label for="catchPhrase">Catch Phrase</label>
      <input type="text" id="catchPhrase" formControlName="catchPhrase" />
    </div>
    <div class="form-group">
      <label for="bs">BS</label>
      <input type="text" id="bs" formControlName="bs" />
    </div>
  </div>
</form>
