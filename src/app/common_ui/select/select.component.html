<div class="select_wrapper">
  <div
    class="select"
    (click)="toggleDropdown()"
    [class.open]="isOpen"
    role="combobox"
    aria-haspopup="listbox"
    aria-expanded="{{ isOpen }}"
  >
    <label class="select_label">{{ placeholder }}</label>
    <button class="select_icon" [class.rotate]="isOpen&&type!=='date'" type="button">
      @if (type === 'date') {
        <svg
          width="18"
          height="18"
          viewBox="0 0 18 18"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g clip-path="url(#clip0_1_277)">
            <path
              d="M16.3125 18H1.6875C0.75375 18 0 17.2463 0 16.3125V2.8125C0 1.87875 0.75375 1.125 1.6875 1.125H16.3125C17.2463 1.125 18 1.87875 18 2.8125V16.3125C18 17.2463 17.2463 18 16.3125 18ZM1.6875 2.25C1.3725 2.25 1.125 2.4975 1.125 2.8125V16.3125C1.125 16.6275 1.3725 16.875 1.6875 16.875H16.3125C16.6275 16.875 16.875 16.6275 16.875 16.3125V2.8125C16.875 2.4975 16.6275 2.25 16.3125 2.25H1.6875Z"
              fill="#FDFDFD"
            />
            <path
              d="M5.0625 4.5C4.7475 4.5 4.5 4.2525 4.5 3.9375V0.5625C4.5 0.2475 4.7475 0 5.0625 0C5.3775 0 5.625 0.2475 5.625 0.5625V3.9375C5.625 4.2525 5.3775 4.5 5.0625 4.5ZM12.9375 4.5C12.6225 4.5 12.375 4.2525 12.375 3.9375V0.5625C12.375 0.2475 12.6225 0 12.9375 0C13.2525 0 13.5 0.2475 13.5 0.5625V3.9375C13.5 4.2525 13.2525 4.5 12.9375 4.5ZM17.4375 6.75H0.5625C0.2475 6.75 0 6.5025 0 6.1875C0 5.8725 0.2475 5.625 0.5625 5.625H17.4375C17.7525 5.625 18 5.8725 18 6.1875C18 6.5025 17.7525 6.75 17.4375 6.75Z"
              fill="#FDFDFD"
            />
          </g>
          <defs>
            <clipPath id="clip0_1_277">
              <rect width="18" height="18" fill="white" />
            </clipPath>
          </defs>
        </svg>
      } @else {
        <svg
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M16.2475 6.65752L9.99997 12.7475L3.75247 6.65752C3.64085 6.54849 3.49101 6.48746 3.33497 6.48746C3.17894 6.48746 3.0291 6.54849 2.91747 6.65752C2.86343 6.71048 2.82049 6.77368 2.79118 6.84344C2.76186 6.9132 2.74677 6.98811 2.74677 7.06377C2.74677 7.13944 2.76186 7.21434 2.79118 7.2841C2.82049 7.35386 2.86343 7.41707 2.91747 7.47002L9.56372 13.95C9.68044 14.0638 9.83698 14.1275 9.99997 14.1275C10.163 14.1275 10.3195 14.0638 10.4362 13.95L17.0825 7.47127C17.1369 7.41828 17.1802 7.35491 17.2097 7.28493C17.2392 7.21494 17.2545 7.13974 17.2545 7.06377C17.2545 6.9878 17.2392 6.91261 17.2097 6.84262C17.1802 6.77263 17.1369 6.70927 17.0825 6.65627C16.9709 6.54724 16.821 6.48621 16.665 6.48621C16.5089 6.48621 16.3591 6.54724 16.2475 6.65627V6.65752Z"
            fill="#FDFDFD"
          />
        </svg>
      }
    </button>
  </div>
  <ul class="dropdown" [class.open]="isOpen" role="listbox">
    @for (option of options; track option.value) {
      <li class="option" (click)="toggleDropdown()" role="option">
        {{ option.label }}
      </li>
    }
  </ul>
  <p class="select_description">{{ desc }}</p>
</div>
